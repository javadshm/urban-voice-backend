version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: urban_voice_db
    environment:
      POSTGRES_DB: ${DB_NAME:-urban_voice_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/migrations/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
    networks:
      - urban_voice_network

  backend:
    build: .
    container_name: urban_voice_backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-urban_voice_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_change_in_production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./src:/app/src
    command: npm run dev
    networks:
      - urban_voice_network

volumes:
  postgres_data:

networks:
  urban_voice_network:
    driver: bridge
